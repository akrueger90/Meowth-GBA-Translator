[translation]
# Free offline translation. The language-pair model downloads on first use.
provider = "local"
model = "argos-opus"
source_language = "en"
target_language = "zh-Hans"
llm_for_tables = true

# Remote providers can add a [translation.api] section with key_env/base_url.

[font_patch]
armips_path = "tools/armips"
game = "FR"

[output]
dir = "outputs"
cache_dir = "work/cache"
