name: Build MeowthBridge

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64 bridge
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources
          Copy-Item "HexManiacAdvance\src\HexManiac.Core\Models\Code\*.toml" resources\
          Copy-Item "HexManiacAdvance\src\HexManiac.Core\Models\Code\*.txt" resources\
          Copy-Item "HexManiacAdvance\src\HexManiac.Core\Models\Code\*.py" resources\

      - name: Publish bridge
        shell: pwsh
        run: |
          dotnet publish src/MeowthBridge `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishTrimmed=false `
            -o build/windows-x64
          Copy-Item -Recurse resources build\windows-x64\

      - uses: actions/upload-artifact@v4
        with:
          name: meowth-bridge-windows-x64
          path: build/windows-x64/
          retention-days: 30

  build-linux:
    name: Linux x64 bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare resources
        run: |
          mkdir -p resources
          cp HexManiacAdvance/src/HexManiac.Core/Models/Code/*.{toml,txt,py} resources/

      - name: Publish bridge
        run: |
          dotnet publish src/MeowthBridge \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishTrimmed=false \
            -o build/linux-x64
          cp -r resources build/linux-x64/
          chmod +x build/linux-x64/MeowthBridge

      - uses: actions/upload-artifact@v4
        with:
          name: meowth-bridge-linux-x64
          path: build/linux-x64/
          retention-days: 30

  build-macos:
    name: macOS bridges
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - runtime: osx-x64
            platform: macos-x64
          - runtime: osx-arm64
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare resources
        run: |
          mkdir -p resources
          cp HexManiacAdvance/src/HexManiac.Core/Models/Code/*.{toml,txt,py} resources/

      - name: Publish bridge
        run: |
          dotnet publish src/MeowthBridge \
            -c Release \
            -r "${{ matrix.runtime }}" \
            --self-contained true \
            -p:PublishTrimmed=false \
            -o "build/${{ matrix.platform }}"
          cp -r resources "build/${{ matrix.platform }}/"
          chmod +x "build/${{ matrix.platform }}/MeowthBridge"

      - name: Verify native architecture
        run: |
          file "build/${{ matrix.platform }}/MeowthBridge"
          file "build/${{ matrix.platform }}/libhostfxr.dylib"
          expected="${{ matrix.runtime == 'osx-arm64' && 'arm64' || 'x86_64' }}"
          file "build/${{ matrix.platform }}/MeowthBridge" | grep -q "$expected"
          file "build/${{ matrix.platform }}/libhostfxr.dylib" | grep -q "$expected"

      - uses: actions/upload-artifact@v4
        with:
          name: meowth-bridge-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/
          retention-days: 30
