name: Build MeowthBridge

concurrency:
  group: build-csharp-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

on:
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of the artifacts containing binaries"
        value: meowth-bridge-binaries
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
    paths:
      - 'src/MeowthBridge/**'
      - '.github/workflows/build-csharp.yml'

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare resources for MeowthBridge
        run: |
          New-Item -ItemType Directory -Force -Path resources
          Copy-Item -Path "HexManiacAdvance\src\HexManiac.Core\Models\Code\*.toml" -Destination resources\
          Copy-Item -Path "HexManiacAdvance\src\HexManiac.Core\Models\Code\*.txt" -Destination resources\
          Copy-Item -Path "HexManiacAdvance\src\HexManiac.Core\Models\Code\*.py" -Destination resources\

      - name: Build MeowthBridge
        run: |
          dotnet publish src/MeowthBridge `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishTrimmed=false `
            -o build/windows
          Copy-Item -Recurse -Path resources -Destination build\windows\

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: meowth-bridge-windows
          path: build/windows/
          retention-days: 7

  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare resources for MeowthBridge
        run: |
          mkdir -p resources
          cp HexManiacAdvance/src/HexManiac.Core/Models/Code/*.toml resources/
          cp HexManiacAdvance/src/HexManiac.Core/Models/Code/*.txt resources/
          cp HexManiacAdvance/src/HexManiac.Core/Models/Code/*.py resources/

      - name: Build MeowthBridge (x64)
        run: |
          dotnet publish src/MeowthBridge \
            -c Release \
            -r osx-x64 \
            --self-contained true \
            -p:PublishTrimmed=false \
            -o build/macos-x64

      - name: Build MeowthBridge (arm64)
        run: |
          dotnet publish src/MeowthBridge \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -p:PublishTrimmed=false \
            -o build/macos-arm64

      - name: Add resources to macOS bundles
        run: |
          cp -r resources build/macos-x64/
          cp -r resources build/macos-arm64/
          chmod +x build/macos-x64/MeowthBridge
          chmod +x build/macos-arm64/MeowthBridge

      - name: Verify macOS native architectures
        run: |
          file build/macos-x64/MeowthBridge build/macos-x64/libhostfxr.dylib
          file build/macos-arm64/MeowthBridge build/macos-arm64/libhostfxr.dylib
          file build/macos-x64/MeowthBridge | grep -q "x86_64"
          file build/macos-x64/libhostfxr.dylib | grep -q "x86_64"
          file build/macos-arm64/MeowthBridge | grep -q "arm64"
          file build/macos-arm64/libhostfxr.dylib | grep -q "arm64"

      - name: Upload macOS x64 binary
        uses: actions/upload-artifact@v4
        with:
          name: meowth-bridge-macos-x64
          path: build/macos-x64/
          retention-days: 7

      - name: Upload macOS arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: meowth-bridge-macos-arm64
          path: build/macos-arm64/
          retention-days: 7

  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare resources for MeowthBridge
        run: |
          mkdir -p resources
          cp HexManiacAdvance/src/HexManiac.Core/Models/Code/*.toml resources/
          cp HexManiacAdvance/src/HexManiac.Core/Models/Code/*.txt resources/
          cp HexManiacAdvance/src/HexManiac.Core/Models/Code/*.py resources/

      - name: Build MeowthBridge
        run: |
          dotnet publish src/MeowthBridge \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishTrimmed=false \
            -o build/linux
          cp -r resources build/linux/

      - name: Make executable
        run: chmod +x build/linux/MeowthBridge

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: meowth-bridge-linux
          path: build/linux/
          retention-days: 7

  combine-artifacts:
    name: Combine all binaries
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: meowth-bridge-windows
          path: binaries/windows

      - name: Download macOS x64 binary
        uses: actions/download-artifact@v4
        with:
          name: meowth-bridge-macos-x64
          path: binaries/macos-x64

      - name: Download macOS arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: meowth-bridge-macos-arm64
          path: binaries/macos-arm64

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: meowth-bridge-linux
          path: binaries/linux

      - name: List binaries
        run: |
          echo "=== Windows ==="
          ls -lh binaries/windows/
          echo "Windows resources:"
          ls -la binaries/windows/resources/ || echo "No resources dir"
          echo ""
          echo "=== macOS x64 ==="
          ls -lh binaries/macos-x64/
          echo "macOS x64 resources:"
          ls -la binaries/macos-x64/resources/ || echo "No resources dir"
          echo ""
          echo "=== macOS arm64 ==="
          ls -lh binaries/macos-arm64/
          echo "macOS arm64 resources:"
          ls -la binaries/macos-arm64/resources/ || echo "No resources dir"
          echo ""
          echo "=== Linux ==="
          ls -lh binaries/linux/
          echo "Linux resources:"
          ls -la binaries/linux/resources/ || echo "No resources dir"

      - name: Upload combined binaries
        uses: actions/upload-artifact@v4
        with:
          name: meowth-bridge-binaries
          path: binaries/
          retention-days: 30

  upload-to-release:
    name: Upload binaries to Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write  # Required to upload files to release
    steps:
      - name: Resolve release tag
        id: release-tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: meowth-bridge-windows
          path: binaries/windows

      - name: Download macOS x64 binary
        uses: actions/download-artifact@v4
        with:
          name: meowth-bridge-macos-x64
          path: binaries/macos-x64

      - name: Download macOS arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: meowth-bridge-macos-arm64
          path: binaries/macos-arm64

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: meowth-bridge-linux
          path: binaries/linux

      - name: Create ZIP packages
        run: |
          # Create ZIP archives with all dependencies
          cd binaries/windows && zip -r ../../MeowthBridge-windows.zip . && cd ../..
          cd binaries/macos-x64 && zip -r ../../MeowthBridge-macos-x64.zip . && cd ../..
          cd binaries/macos-arm64 && zip -r ../../MeowthBridge-macos-arm64.zip . && cd ../..
          cd binaries/linux && zip -r ../../MeowthBridge-linux.zip . && cd ../..

          # Verify packages
          ls -lh MeowthBridge-*.zip
          echo ""
          echo "Package sizes:"
          du -h MeowthBridge-*.zip

      - name: Upload Windows binary to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          files: MeowthBridge-windows.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS binaries to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          files: |
            MeowthBridge-macos-x64.zip
            MeowthBridge-macos-arm64.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux binary to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          files: MeowthBridge-linux.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
