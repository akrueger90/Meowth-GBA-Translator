name: Build Desktop Apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[gui,dev,local]"

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Run tests
        run: python -m pytest -q tests

  build-binaries:
    name: Build native bridges
    needs: quality
    uses: ./.github/workflows/build-csharp.yml

  build-app:
    name: ${{ matrix.label }}
    needs: build-binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            platform: windows-x64
            bridge: meowth-bridge-windows-x64
            package: dist/Meowth-Translator-Windows-x64.zip
          - label: Linux x64
            os: ubuntu-latest
            platform: linux-x64
            bridge: meowth-bridge-linux-x64
            package: dist/Meowth-Translator-Linux-x64.tar.gz
          - label: macOS Intel
            os: macos-15-intel
            platform: macos-x64
            bridge: meowth-bridge-macos-x64
            package: dist/Meowth-Translator-macOS-x64.dmg
          - label: macOS Apple Silicon
            os: macos-15
            platform: macos-arm64
            bridge: meowth-bridge-macos-arm64
            package: dist/Meowth-Translator-macOS-arm64.dmg

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install pyinstaller -e ".[gui,local]"

      - name: Download native bridge
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.bridge }}
          path: src/meowth/binaries/${{ matrix.platform }}/

      - name: Build armips
        shell: bash
        run: |
          cmake -S armips -B armips/build -DCMAKE_BUILD_TYPE=Release
          cmake --build armips/build --config Release
          mkdir -p tools
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp armips/build/Release/armips.exe tools/armips.exe
            rm -f tools/armips
          else
            cp armips/build/armips tools/armips
            chmod +x tools/armips
            rm -f tools/armips.exe
            chmod +x "src/meowth/binaries/${{ matrix.platform }}/MeowthBridge"
          fi

      - name: Build desktop application
        shell: bash
        run: |
          separator=":"
          if [ "$RUNNER_OS" = "Windows" ]; then
            separator=";"
          fi
          pyinstaller \
            --name "Meowth Translator" \
            --windowed \
            --onedir \
            --add-data "src/meowth${separator}meowth" \
            --add-data "pokeapi/data/v2/csv${separator}pokeapi/data/v2/csv" \
            --add-data "Pokemon_GBA_Font_Patch${separator}Pokemon_GBA_Font_Patch" \
            --add-data "tools${separator}tools" \
            --hidden-import customtkinter \
            --hidden-import PIL \
            --hidden-import click \
            --hidden-import httpx \
            --hidden-import ctranslate2 \
            --hidden-import sentencepiece \
            --collect-all customtkinter \
            --collect-all ctranslate2 \
            --collect-all sentencepiece \
            launcher.py

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\Meowth Translator" `
            -DestinationPath "dist\Meowth-Translator-Windows-x64.zip"

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          tar -czf dist/Meowth-Translator-Linux-x64.tar.gz -C dist "Meowth Translator"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg-content
          cp -R "dist/Meowth Translator.app" dmg-content/
          ln -s /Applications dmg-content/Applications
          hdiutil create \
            -volname "Meowth Translator" \
            -srcfolder dmg-content \
            -ov \
            -format UDZO \
            "${{ matrix.package }}"

      - uses: actions/upload-artifact@v4
        with:
          name: meowth-translator-${{ matrix.platform }}
          path: ${{ matrix.package }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: meowth-translator-*
          path: release/gui
          merge-multiple: true

      - name: Download bridge packages
        uses: actions/download-artifact@v4
        with:
          pattern: meowth-bridge-*
          path: release/bridge

      - name: Prepare release assets
        run: |
          mkdir -p release/assets
          find release/gui -maxdepth 1 -type f -exec cp {} release/assets/ \;
          for platform in windows-x64 linux-x64 macos-x64 macos-arm64; do
            artifact="release/bridge/meowth-bridge-${platform}"
            test -d "$artifact"
            (
              cd "$artifact"
              zip -r "../../assets/MeowthBridge-${platform}.zip" .
            )
          done
          ls -lh release/assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/assets/*
